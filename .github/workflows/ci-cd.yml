name: CI/CD Scriptum Auth

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    name: Testes, build e SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Nota: A instalação do Tesseract foi removida pois o Auth é 100% Java

      - name: Executar testes e build Quarkus
        # Verifique se o seu build.gradle possui essas tasks customizadas. 
        # Se não tiver, altere para: ./gradlew --no-daemon clean build jacocoTestReport
        run: ./gradlew --no-daemon unitTest integrationTest jacocoSonarReport quarkusBuild

      - name: Publicar relatórios de testes e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-cobertura
          if-no-files-found: ignore
          path: |
            build/reports/tests/unitTest/
            build/reports/tests/integrationTest/
            build/reports/jacoco/jacocoSonarReport/

      - name: Analisar e validar qualidade no SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=build/classes/java/main
            -Dsonar.java.test.binaries=build/classes/java/test
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/jacocoSonarReport/jacocoSonarReport.xml
            -Dsonar.junit.reportPaths=build/test-results/unitTest,build/test-results/integrationTest
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.qualitygate.wait=true

  implantar-dev:
    name: Publicar e Implantar em DEV (Develop)
    needs: validar
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    outputs:
      digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Ler e validar versão SemVer
        run: |
          VERSION="$(cat VERSION)"
          # Validação SemVer em Python mantida do arquivo original
          if ! python3 - "$VERSION" <<'PY'
          import re
          import sys
          pattern = r'^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$'
          sys.exit(0 if re.fullmatch(pattern, sys.argv[1]) else 1)
          PY
          then
            echo "::error::VERSION não contém uma versão SemVer válida"
            exit 1
          fi
          echo "DOCKER_TAG_VERSION=${VERSION%%+*}" >> "$GITHUB_ENV"

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Preparar tags da imagem (DEV)
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/scriptum-auth
          tags: |
            type=raw,value=v${{ env.DOCKER_TAG_VERSION }}-dev
            type=sha,prefix=sha-

      - name: Compilar e publicar imagem no Docker Hub
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}

      - name: Implantar imagem em DEV no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEV_DEPLOY_HOOK_URL }}
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          IMAGE_URL="docker.io/${DOCKERHUB_USERNAME}/scriptum-auth@${IMAGE_DIGEST}"
          echo "Solicitando deploy no Render da imagem ${IMAGE_URL}"
          curl --fail-with-body --silent --show-error --retry 3 \
            --get --data-urlencode "imgURL=${IMAGE_URL}" \
            "$RENDER_DEPLOY_HOOK_URL"

  implantar-homol:
    name: Publicar e Implantar em HOMOL (Main)
    needs: validar
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      
      - name: Ler e validar versão SemVer
        run: |
          VERSION="$(cat VERSION)"
          echo "DOCKER_TAG_VERSION=${VERSION%%+*}" >> "$GITHUB_ENV"

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Preparar tags da imagem (HOMOL)
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/scriptum-auth
          tags: |
            type=raw,value=v${{ env.DOCKER_TAG_VERSION }}-homol
            type=sha,prefix=sha-

      - name: Compilar e publicar imagem no Docker Hub
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}

      - name: Implantar imagem em HOMOL no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_HOMOL_DEPLOY_HOOK_URL }}
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          IMAGE_URL="docker.io/${DOCKERHUB_USERNAME}/scriptum-auth@${IMAGE_DIGEST}"
          echo "Solicitando deploy no Render da imagem ${IMAGE_URL}"
          curl --fail-with-body --silent --show-error --retry 3 \
            --get --data-urlencode "imgURL=${IMAGE_URL}" \
            "$RENDER_DEPLOY_HOOK_URL"