name: CI/CD Pipeline - Note Manager

on:
  push:
    branches:
      - main
      - 'release/**'

jobs:
  validar:
    name: Testes e SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permissao de execucao ao Maven
        run: chmod +x mvnw

      - name: Executar testes e gerar relatorios
        run: ./mvnw clean test

      - name: Truque DevOps - Ocultar pom.xml
        run: mv pom.xml pom.xml.bkp

      - name: Analisar no SonarCloud
        uses: sonarsource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Saigo0_note-manager
            -Dsonar.organization=saigo0
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.test.binaries=target/test-classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/jacoco-report/jacoco.xml
            -Dsonar.junit.reportPaths=target/surefire-reports
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.qualitygate.wait=false

  implantar-homol:
    name: Publicar e Implantar (Homol)
    needs: validar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ler e validar versão do POM (SemVer)
        run: |
          # O Maven extrai a versão silenciosamente do pom.xml
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          if ! python3 - "$VERSION" <<'PY'
          import re
          import sys
          pattern = r'^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$'
          sys.exit(0 if re.fullmatch(pattern, sys.argv[1]) else 1)
          PY
          then
            echo "::error::Versão no pom.xml ($VERSION) não é um SemVer válido"
            exit 1
          fi
          echo "DOCKER_TAG_VERSION=${VERSION%%+*}" >> "$GITHUB_ENV"

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Preparar tags (HOMOL)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/scriptum-note-manager
          tags: |
            type=raw,value=v${{ env.DOCKER_TAG_VERSION }}-homol
            type=raw,value=latest-homol

      - name: Construir e enviar imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Atualizar ambiente no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_HOMOL_DEPLOY_HOOK_URL }}
        run: |
           curl --fail-with-body --silent --show-error --retry 3 --get --data-urlencode "imgURL=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/scriptum-note-manager:v${{ env.DOCKER_TAG_VERSION }}-homol" "$RENDER_DEPLOY_HOOK_URL"

  implantar-prod:
    name: Publicar e Implantar (Prod)
    needs: validar
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ler e validar versão do POM (SemVer)
        run: |
            VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
            if ! python3 - "$VERSION" <<'PY'
            import re
            import sys
            pattern = r'^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$'
            sys.exit(0 if re.fullmatch(pattern, sys.argv[1]) else 1)
            PY
            then
                echo "::error::Versão no pom.xml ($VERSION) não é um SemVer válido"
                exit 1
            fi
            echo "DOCKER_TAG_VERSION=${VERSION%%+*}" >> "$GITHUB_ENV"

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Preparar tags (PROD)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/scriptum-note-manager
          tags: |
            type=raw,value=v${{ env.DOCKER_TAG_VERSION }}-prod

      - name: Construir e enviar imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Atualizar ambiente no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PROD_DEPLOY_HOOK_URL }}
        run: |
           curl --fail-with-body --silent --show-error --retry 3 --get --data-urlencode "imgURL=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/scriptum-note-manager:v${{ env.DOCKER_TAG_VERSION }}-prod" "$RENDER_DEPLOY_HOOK_URL"